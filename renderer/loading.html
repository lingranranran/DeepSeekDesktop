<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DeepSeek Harness</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0f1117;
      color: #e6e6e6;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2d38;
      border-top-color: #4f8cff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .label {
      font-size: 14px;
      color: #a8adbd;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label">正在启动 DeepSeek Harness 服务…</div>
</body>
</html>
