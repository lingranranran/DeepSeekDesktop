# DeepSeek Harness Desktop 打包配置（Windows NSIS）
appId: io.github.deepseek-harness.desktop
productName: DeepSeek Harness Desktop

directories:
  output: release

# 应用自身文件打进 app.asar（dependencies 为空，不会带入 node_modules）
files:
  - dist/**
  - renderer/**
  - resources/icons/**

# 内置运行时（Node 22 LTS + 锁定版本 dsh）以单文件 tar 进 extraResources：
# v0.1.0 曾以 3 万+散文件安装，NSIS 逐文件解压在 Defender 实时扫描下形似卡死；
# v0.1.1 起只装一个 338MB 的 node-runtime.tar（安装仅需数秒），
# 应用首次启动时解压到 userData/runtime 并显示进度（见 electron/runtime-setup.ts）
extraResources:
  - from: resources
    to: .
    filter:
      - node-runtime.tar

win:
  target:
    - target: nsis
      arch:
        - x64
  # 256px PNG，electron-builder 自动转换为 ico
  icon: resources/icons/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  artifactName: DeepSeek-Harness-Desktop-Setup-${version}.${ext}
  # 卸载时询问是否清理 userData（内置运行时/日志/设置），见 build/installer.nsh
  include: build/installer.nsh
